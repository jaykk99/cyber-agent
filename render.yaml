services:
  - type: web
    name: cyber-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CYBER_AGENT_CODE
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: HORDE_API_KEY
        sync: false
      - key: RECON_BASE_URL
        value: https://recon-anything.onrender.com
    healthCheckPath: /api/health
